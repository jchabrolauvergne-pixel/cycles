<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Up — Espace parent</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2323342d'/%3E%3Cpath d='M32 11 L51 34 H40 V53 H24 V34 H13 Z' fill='%23f5d76e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbfaf6; --card:#ffffff; --ink:#1d2433; --muted:#5f6878; --border:#e6e2d8;
    --board:#23342d; --board2:#1b2823; --chalk:#f4f1e8; --chalk-y:#f5d76e; --wood:#8a5a32;
    --ok:#2e9e5b; --ok-soft:#e3f6ea; --mid:#e3a33c; --mid-soft:#fbf0d6; --ko:#d14343; --ko-soft:#fbe5e5;
    --fr:#2c4fa3; --fr-soft:#e6ecfa; --shadow:0 1px 2px rgba(30,30,40,.06),0 8px 24px -12px rgba(30,30,40,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141823; --card:#1b2130; --ink:#eceef4; --muted:#a3abbb; --border:#2a3245;
      --board:#16211c; --board2:#101813; --ok-soft:#16302a; --mid-soft:#3a2e15; --ko-soft:#3a1d1d; --fr:#8aa8ff; --fr-soft:#1f2a47;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}
  header{background:radial-gradient(120% 140% at 20% 0%, #2f463c 0%, var(--board) 45%, var(--board2) 100%);color:var(--chalk);border-bottom:8px solid var(--wood)}
  header .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
  .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--chalk-y),#ffb84d);display:grid;place-items:center;flex:none}
  h1{font-family:Fraunces,Georgia,serif;font-size:28px;margin:0;line-height:1}
  h1 small{display:block;font:600 14px Caveat,cursive;font-size:20px;color:#e9e4d4;margin-top:4px}
  header .sp{flex:1}
  header a, header button.link{color:#d8e0d8;font:600 14px Inter,sans-serif;background:none;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none}
  main{padding:22px 0 50px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  h2{font-family:Fraunces,serif;font-size:22px;margin:0 0 12px}
  h3{font-size:16px;margin:0 0 10px}
  .muted{color:var(--muted)}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
  input,select{font:600 17px Inter,sans-serif;padding:10px 12px;border:2px solid var(--border);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
  input:focus,select:focus{outline:none;border-color:var(--fr)}
  .btn{font:700 15px Inter,sans-serif;border-radius:12px;padding:10px 16px;cursor:pointer;border:2px solid var(--board);background:var(--board);color:var(--chalk-y)}
  .btn.alt{background:var(--card);color:var(--ink);border-color:var(--border)}
  .btn.danger{background:var(--card);color:var(--ko);border-color:var(--ko)}
  .btn:disabled{opacity:.6;cursor:wait}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .err{color:var(--ko);font-weight:600;min-height:1.3em;margin:8px 0 0}
  .okmsg{color:var(--ok);font-weight:600;min-height:1.3em;margin:8px 0 0}
  .narrow{max-width:440px;margin:30px auto}
  .kids{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .kid{border:2px solid var(--border);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:700 15px Inter,sans-serif;cursor:pointer;box-shadow:var(--shadow)}
  .kid.on{background:var(--board);color:var(--chalk-y);border-color:var(--board)}
  .kid small{font-weight:600;opacity:.75;margin-left:4px}
  .kid.add{border-style:dashed;color:var(--muted)}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .tile small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tile b{font-family:Fraunces,serif;font-size:26px}
  .tile span{font-size:13px;color:var(--muted)}
  .chart{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;align-items:end;height:120px;margin-top:6px}
  .chart div{border-radius:4px 4px 0 0;background:var(--border);min-height:3px;position:relative}
  .chart div.g{background:var(--ok)} .chart div.m{background:var(--mid)} .chart div.b{background:var(--ko)}
  .chart div:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--card);font-size:12px;padding:3px 7px;border-radius:6px;margin-bottom:4px;z-index:2}
  .axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  td.n{text-align:right;white-space:nowrap} th.n{text-align:right}
  .pct{display:inline-block;min-width:46px;text-align:center;border-radius:8px;padding:1px 6px;font-weight:700;font-size:14px}
  .pct.g{background:var(--ok-soft);color:var(--ok)} .pct.m{background:var(--mid-soft);color:#a86a10} .pct.b{background:var(--ko-soft);color:var(--ko)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .errs li{margin:0 0 10px;list-style:none;border-left:4px solid var(--ko);padding:4px 0 4px 10px}
  .errs{padding:0;margin:0}
  .errs .it{font-size:15px}
  .errs .meta{font-size:13px;color:var(--muted)}
  .errs b.exp{color:var(--ok)} .errs s{color:var(--ko)}
  .times{float:right;background:var(--ko-soft);color:var(--ko);font-weight:700;border-radius:999px;padding:0 8px;font-size:13px}
  .recent tr.click{cursor:pointer} .recent tr.click:hover td{background:var(--paper)}
  .detail td{background:var(--paper);font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:20px 0;font-family:Caveat,cursive;font-size:22px}
  .loading{color:var(--muted)}
  @media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 3 L20 12 H15.5 V21 H8.5 V12 H4 Z" fill="#23342d"/></svg></div>
  <h1>Level Up<small>Espace parent</small></h1>
  <span class="sp"></span>
  <a href="index.html">← Retour au site</a>
  <span id="hdrActions"></span>
</div></header>

<main><div class="wrap" id="app"><p class="loading">Chargement…</p></div></main>

<script src="levelup.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const app = $('app');
const LS = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const rpc = (fn, args) => LevelUp.rpc(fn, args);
let TOKEN = LS.get('lu_parent'), KIDS = [], CUR = LS.get('lu_parent_kid');

/* ---------- libellés des quiz ---------- */
const QUIZ = {
  'a-ou-a-1':'« a » ou « à » + dictée', 'son-e-1':'Son « é » — série 1', 'son-e-2':'Son « é » — série 2', 'homophones-1':'Homophones',
  'tables-6-10':'Tables de 6 à 10', 'histoire-temps-1':'Repères dans le temps + chiffres romains',
  'accords-4e':'Accords et nature des mots', 'imp-ps-4e':'Imparfait et passé simple', 'waste-cm2':'Waste (anglais)'
};
const MODE = { aa:'quiz a/à', mots:'mots de la dictée', texte:'texte à corriger', quiz:'quiz', manque:'facteur manquant', chrono:'défi chrono',
  qcm:'quiz', rom:'chiffres romains', frise:'frise', conj:'conjuguer', choix:'imp. ou p. s. ?', 'transfo-guide':'transformer (guidé)', 'transfo-expert':'transformer (expert)',
  'niveau-1':'quiz niveau 1', 'niveau-2':'quiz niveau 2', tri:'tri des déchets', spelling:'dictée de mots', 'texte-1':'texte 1', 'texte-2':'texte 2' };
const modeName = m => MODE[m] || (/^texte-\d+$/.test(m) ? 'texte ' + m.split('-')[1] : m);
const quizName = (q, m) => `${QUIZ[q] || q}${m ? ' · ' + modeName(m) : ''}`;
const pctCls = p => p >= 80 ? 'g' : p >= 50 ? 'm' : 'b';
const pctTag = p => p === null || p === undefined ? '—' : `<span class="pct ${pctCls(p)}">${Math.round(p)} %</span>`;
const fmtDate = d => new Date(d).toLocaleString('fr-FR', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const ago = d => { if (!d) return 'jamais'; const h = (Date.now() - new Date(d)) / 36e5;
  return h < 1 ? 'il y a moins d\'une heure' : h < 24 ? `il y a ${Math.round(h)} h` : h < 48 ? 'hier' : `il y a ${Math.round(h/24)} jours`; };
function levelFrom(total){ let lv = 1, need = 60, rest = total; while (rest >= need) { rest -= need; lv++; need += 40; } return lv; }

function errMsg(e){
  const m = {code_faux:'Code incorrect.', verrouille:'Trop d\'essais : réessaie dans 15 minutes.', code_invalide:'Le code doit faire au moins 4 caractères.',
    prenom_existe:'Ce prénom existe déjà.', prenom_invalide:'Prénom invalide.', pin_invalide:'Le code enfant doit faire exactement 4 chiffres.',
    deja_configure:'Le code parent est déjà défini : connecte-toi.', non_configure:'Aucun code parent défini.'}[e.code];
  return m || 'Erreur de connexion à la base (Internet ?).';
}
async function guarded(fn){
  try { return await fn(); }
  catch(e){ if (e.code === 'session_invalide') { LS.del('lu_parent'); TOKEN = null; boot(); return null; } throw e; }
}

/* ---------- écrans d'accès ---------- */
async function boot(){
  $('hdrActions').innerHTML = '';
  let st;
  try { st = await rpc('lu_parent_status', {}); }
  catch(e){ app.innerHTML = `<div class="card narrow"><h2>Base indisponible</h2><p class="muted">Impossible de joindre la base de données. Vérifie ta connexion, ou que le projet Supabase n'est pas en pause (tableau de bord Supabase → « Resume »).</p><div class="row"><button class="btn" onclick="boot()">Réessayer</button></div></div>`; return; }
  if (!st.configured) return setupScreen();
  if (!TOKEN) return loginScreen();
  dashboard();
}
function setupScreen(){
  app.innerHTML = `<form class="card narrow" id="f"><h2>Bienvenue ! 👋</h2>
    <p class="muted">Première utilisation : choisis le <b>code parent</b> qui protège cet espace (au moins 4 caractères, chiffres ou lettres). Garde-le pour toi.</p>
    <label for="c1">Code parent</label><input id="c1" type="password" autocomplete="new-password" required minlength="4">
    <label for="c2">Confirme le code</label><input id="c2" type="password" autocomplete="new-password" required minlength="4">
    <p class="err" id="e"></p><div class="row"><button class="btn" id="b">Créer l'espace parent</button></div></form>`;
  $('c1').focus();
  $('f').onsubmit = async ev => { ev.preventDefault();
    if ($('c1').value !== $('c2').value) { $('e').textContent = 'Les deux codes sont différents.'; return; }
    $('b').disabled = true;
    try { const r = await rpc('lu_parent_setup', {p_code: $('c1').value}); TOKEN = r.token; LS.set('lu_parent', TOKEN); dashboard(); }
    catch(e){ $('e').textContent = errMsg(e); $('b').disabled = false; }
  };
}
function loginScreen(){
  app.innerHTML = `<form class="card narrow" id="f"><h2>Espace parent</h2>
    <p class="muted">Entre ton code parent pour voir la progression des enfants.</p>
    <label for="c">Code parent</label><input id="c" type="password" autocomplete="current-password" required>
    <p class="err" id="e"></p><div class="row"><button class="btn" id="b">Entrer</button></div></form>`;
  $('c').focus();
  $('f').onsubmit = async ev => { ev.preventDefault(); $('b').disabled = true;
    try { const r = await rpc('lu_parent_login', {p_code: $('c').value}); TOKEN = r.token; LS.set('lu_parent', TOKEN); dashboard(); }
    catch(e){ $('e').textContent = errMsg(e); $('b').disabled = false; $('c').select(); }
  };
}

/* ---------- tableau de bord ---------- */
async function dashboard(){
  $('hdrActions').innerHTML = `<button class="link" id="chg">Code parent</button> <button class="link" id="out">Se déconnecter</button>`;
  $('out').onclick = () => { LS.del('lu_parent'); TOKEN = null; boot(); };
  $('chg').onclick = changeCode;
  app.innerHTML = `<p class="loading">Chargement…</p>`;
  const kids = await guarded(() => rpc('lu_parent_profiles', {p_token: TOKEN}));
  if (!kids) return;
  KIDS = kids;
  if (!KIDS.length) return kidForm(null, true);
  if (!KIDS.some(k => k.id === CUR)) CUR = KIDS[0].id;
  renderKid();
}
function kidsBar(){
  return `<div class="kids">${KIDS.map(k => `<button class="kid ${k.id===CUR?'on':''}" data-id="${k.id}">${esc(k.prenom)}<small>${esc(k.niveau)}</small></button>`).join('')}
    <button class="kid add" id="addKid">＋ Ajouter un enfant</button></div>`;
}
function bindKids(){
  document.querySelectorAll('.kid[data-id]').forEach(b => b.onclick = () => { CUR = b.dataset.id; LS.set('lu_parent_kid', CUR); renderKid(); });
  $('addKid').onclick = () => kidForm(null);
}
async function renderKid(){
  const k = KIDS.find(x => x.id === CUR);
  app.innerHTML = kidsBar() + `<p class="loading">Chargement des résultats de ${esc(k.prenom)}…</p>`; bindKids();
  const d = await guarded(() => rpc('lu_parent_dashboard', {p_token: TOKEN, p_profile: CUR}));
  if (!d) return;
  const week = d.days.filter(x => (Date.now() - new Date(x.day)) / 864e5 < 7);
  const wPlays = week.reduce((s,x) => s + x.plays, 0);
  const allPlays = d.days.reduce((s,x) => s + x.plays, 0);
  const avg = allPlays ? Math.round(d.days.reduce((s,x) => s + x.pct * x.plays, 0) / allPlays) : null;
  const activeDays = week.length;

  // graphique 28 jours
  const byDay = Object.fromEntries(d.days.map(x => [x.day, x]));
  const maxP = Math.max(1, ...d.days.map(x => x.plays));
  const bars = [];
  for (let i = 27; i >= 0; i--) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    const key = dt.toLocaleDateString('sv-SE', {timeZone:'Europe/Paris'});
    const x = byDay[key];
    const lab = dt.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
    bars.push(x ? `<div class="${pctCls(x.pct)}" style="height:${Math.max(8, x.plays / maxP * 100)}%" data-tip="${lab} : ${x.plays} partie${x.plays>1?'s':''}, ${x.pct} %"></div>`
                : `<div style="height:3px" data-tip="${lab} : rien"></div>`);
  }

  app.innerHTML = kidsBar() + `
    <div class="tiles">
      <div class="tile"><small>Niveau</small><b>${levelFrom(k.xp)}</b> <span>${k.xp} XP</span></div>
      <div class="tile"><small>Cette semaine</small><b>${wPlays}</b> <span>partie${wPlays>1?'s':''} · ${activeDays} jour${activeDays>1?'s':''}</span></div>
      <div class="tile"><small>Réussite (28 j)</small><b>${avg === null ? '—' : avg + ' %'}</b></div>
      <div class="tile"><small>Dernière partie</small><b style="font-size:18px">${esc(ago(k.last_played))}</b></div>
    </div>

    <div class="card"><h3>Activité des 4 dernières semaines</h3>
      ${allPlays ? `<div class="chart">${bars.join('')}</div><div class="axis"><span>il y a 4 semaines</span><span>aujourd'hui</span></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>≥ 80 % de réussite</span><span><i style="background:var(--mid)"></i>50–79 %</span><span><i style="background:var(--ko)"></i>&lt; 50 %</span><span>hauteur = nombre de parties</span></div>`
      : `<p class="empty">Pas encore de partie enregistrée pour ${esc(k.prenom)}.</p>`}
    </div>

    <div class="grid2">
      <div class="card"><h3>🎯 Erreurs qui reviennent (60 jours)</h3>
        ${d.frequent.length ? `<ul class="errs">${d.frequent.slice(0,15).map(e => `<li>
          ${e.n > 1 ? `<span class="times">${e.n}×</span>` : ''}
          <div class="it">${esc(e.item)}</div>
          <div class="meta">attendu <b class="exp">${esc(e.expected)}</b>${e.last_given ? ` · a répondu <s>${esc(e.last_given)}</s>` : ''} · ${esc(QUIZ[e.quiz] || e.quiz)}</div></li>`).join('')}</ul>`
          : `<p class="empty">Aucune erreur enregistrée 👍</p>`}
      </div>
      <div class="card"><h3>📚 Par quiz</h3>
        ${d.quizzes.length ? `<table><tr><th>Quiz</th><th class="n">Parties</th><th class="n">Dernier</th><th class="n hide-m">Moyenne</th><th class="n">Record</th></tr>
          ${d.quizzes.map(q => `<tr><td>${esc(quizName(q.quiz, q.mode))}<br><span class="muted" style="font-size:13px">${esc(ago(q.last))}</span></td>
            <td class="n">${q.plays}</td><td class="n">${pctTag(q.last_pct)}</td><td class="n hide-m">${pctTag(q.avg_pct)}</td><td class="n">${pctTag(q.best_pct)}</td></tr>`).join('')}</table>`
          : `<p class="empty">Rien pour l'instant.</p>`}
      </div>
    </div>

    <div class="card"><h3>🕑 Dernières parties <span class="muted" style="font-weight:400;font-size:14px">(clique sur une partie pour voir ses erreurs)</span></h3>
      ${d.recent.length ? `<table class="recent"><tr><th>Date</th><th>Quiz</th><th class="n">Score</th><th class="n">Erreurs</th></tr>
        ${d.recent.map(r => `<tr class="${r.nerr ? 'click' : ''}" data-rid="${r.id}"><td style="white-space:nowrap">${esc(fmtDate(r.played_at))}</td><td>${esc(quizName(r.quiz, r.mode))}</td>
          <td class="n">${r.score}/${r.total} ${pctTag(100 * r.score / r.total)}</td><td class="n">${r.nerr ? r.nerr + ' ▾' : '—'}</td></tr>`).join('')}</table>`
        : `<p class="empty">Aucune partie.</p>`}
    </div>

    <div class="card"><h3>⚙️ Profil de ${esc(k.prenom)}</h3>
      <p class="muted">Créé le ${new Date(k.created_at).toLocaleDateString('fr-FR')}. Tu peux modifier le prénom, la classe ou le code secret.</p>
      <div class="row"><button class="btn alt" id="editKid">Modifier le profil</button><button class="btn danger" id="delKid">Supprimer</button></div>
      <div id="delZone"></div>
    </div>`;
  bindKids();
  document.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => toggleDetail(tr));
  $('editKid').onclick = () => kidForm(k);
  $('delKid').onclick = () => {
    $('delZone').innerHTML = `<p class="err">Supprimer ${esc(k.prenom)} efface aussi tout son historique. C'est définitif.</p>
      <div class="row"><button class="btn danger" id="delYes">Oui, supprimer</button><button class="btn alt" id="delNo">Annuler</button></div>`;
    $('delNo').onclick = () => $('delZone').innerHTML = '';
    $('delYes').onclick = async () => { await guarded(() => rpc('lu_parent_delete_profile', {p_token: TOKEN, p_id: k.id})); CUR = null; dashboard(); };
  };
}
async function toggleDetail(tr){
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('detail')) { next.remove(); return; }
  const list = await guarded(() => rpc('lu_parent_result_errors', {p_token: TOKEN, p_result: +tr.dataset.rid}));
  if (!list) return;
  const row = document.createElement('tr'); row.className = 'detail';
  row.innerHTML = `<td colspan="4"><ul class="errs">${list.map(e => `<li><div class="it">${esc(e.item)}</div>
    <div class="meta">attendu <b class="exp">${esc(e.expected)}</b> · a répondu <s>${esc(e.given)}</s></div></li>`).join('')}</ul></td>`;
  tr.after(row);
}

/* ---------- ajout / modification d'un enfant ---------- */
function kidForm(k, first){
  const edit = !!k;
  app.innerHTML = (KIDS.length ? kidsBar() : '') + `<form class="card narrow" id="f" style="margin-top:0">
    <h2>${edit ? 'Modifier ' + esc(k.prenom) : first ? 'Ajoute ton premier enfant' : 'Ajouter un enfant'}</h2>
    ${first ? '<p class="muted">Chaque enfant se connecte sur l\'accueil de Level Up avec son prénom et son code à 4 chiffres.</p>' : ''}
    <label for="pn">Prénom</label><input id="pn" required maxlength="40" value="${edit ? esc(k.prenom) : ''}">
    <label for="nv">Classe</label><select id="nv">${['CM2','4e','autre'].map(n => `<option ${edit && k.niveau===n ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <label for="pin">${edit ? 'Nouveau code secret (laisser vide pour garder l\'actuel)' : 'Code secret à 4 chiffres'}</label>
    <input id="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" ${edit ? '' : 'required'} autocomplete="off">
    <p class="err" id="e"></p>
    <div class="row"><button class="btn" id="b">${edit ? 'Enregistrer' : 'Créer le profil'}</button>${KIDS.length ? '<button type="button" class="btn alt" id="cancel">Annuler</button>' : ''}</div>
  </form>`;
  if (KIDS.length) { bindKids(); $('cancel').onclick = () => renderKid(); }
  $('pn').focus();
  $('f').onsubmit = async ev => { ev.preventDefault();
    const pin = $('pin').value.trim();
    if (pin && !/^\d{4}$/.test(pin)) { $('e').textContent = 'Le code doit faire exactement 4 chiffres.'; return; }
    $('b').disabled = true;
    try {
      const r = await guarded(() => rpc('lu_parent_save_profile', {p_token: TOKEN, p_id: edit ? k.id : null, p_prenom: $('pn').value, p_niveau: $('nv').value, p_pin: pin || null}));
      if (!r) return;
      CUR = r.id; LS.set('lu_parent_kid', CUR); dashboard();
    } catch(e){ $('e').textContent = errMsg(e); $('b').disabled = false; }
  };
}

/* ---------- changer le code parent ---------- */
function changeCode(){
  app.innerHTML = `<form class="card narrow" id="f"><h2>Changer le code parent</h2>
    <label for="c1">Nouveau code</label><input id="c1" type="password" autocomplete="new-password" required minlength="4">
    <label for="c2">Confirme</label><input id="c2" type="password" autocomplete="new-password" required minlength="4">
    <p class="err" id="e"></p>
    <div class="row"><button class="btn" id="b">Changer</button><button type="button" class="btn alt" id="cancel">Annuler</button></div></form>`;
  $('cancel').onclick = dashboard;
  $('f').onsubmit = async ev => { ev.preventDefault();
    if ($('c1').value !== $('c2').value) { $('e').textContent = 'Les deux codes sont différents.'; return; }
    try { await guarded(() => rpc('lu_parent_change_code', {p_token: TOKEN, p_new: $('c1').value})); LevelUp.toast('Code parent changé ✔'); dashboard(); }
    catch(e){ $('e').textContent = errMsg(e); }
  };
}

boot();
</script>
